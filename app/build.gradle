apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"
    defaultConfig {
        applicationId "x.com.dialogdialog"
        minSdkVersion 16
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //APP的build.gradle设置支持的SO库架构'armeabi',armeabi-v7a,'x86','arm64-v8a','x86_64'
        ndk {
            abiFilters "armeabi-v7a"//,"arm64-v8a"
        }
    }
    signingConfigs {
        release {
            storeFile file('dialog.jks')
            keyAlias 'dialog'
            keyPassword 'dialog'
            storePassword 'dialog'
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            multiDexEnabled true
            shrinkResources false// 移除无用的resource文件
            zipAlignEnabled true // Zipalign优化
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            zipAlignEnabled true
            shrinkResources true
            minifyEnabled true
            multiDexEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }
    configurations {
        all*.exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    repositories {
        flatDir {
            dirs 'libs', '../map_gmap/libs'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.google.android.material:material:1.0.0'//原来的design

    //生命周期感知
    implementation 'androidx.lifecycle:lifecycle-runtime:2.1.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.1.0'
    // 如果你使用java8开发，可以添加这个依赖，里面只有一个类
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.1.0'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.0-beta-3'
    implementation project(':dialogmodule')
    implementation project(':glide4')
    implementation project(':hhplayer')
    implementation project(':map_amap')
    implementation project(':map_bmap')
    implementation project(':map_gmap')
    implementation project(':map_qmap')
    implementation project(':map_kmap')

    implementation('com.airbnb.android:lottie:3.3.0') {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation 'io.github.lizhangqu:retrace:1.0.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.yanzhenjie:okalle:0.1.7'
    implementation 'com.squareup.okhttp3:okhttp:4.2.2'
}

static def releaseTime() {
    return new Date().format("MMddHH", TimeZone.getTimeZone("GMT+8:00"))
}